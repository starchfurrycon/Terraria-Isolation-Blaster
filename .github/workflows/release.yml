name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test before packaging
        run: dotnet run --project tests/ZhaDai.Core.Tests -c Release

      - name: Publish planner CLI
        run: dotnet publish src/ZhaDai.Cli -c Release -r win-x64 --self-contained false -o staging/cli

      - name: Publish manager
        run: dotnet publish src/ZhaDai.Manager -c Release -r win-x64 --self-contained false -o staging/ui

      - name: Fetch Mono.Cecil
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Mono.Cecil/0.11.6" -OutFile cecil.nupkg
          Expand-Archive cecil.nupkg -DestinationPath cecil
          New-Item -ItemType Directory -Force src/ZhaDai.Patcher/lib | Out-Null
          Copy-Item cecil/lib/net40/*.dll src/ZhaDai.Patcher/lib/

      - name: Build runtime plugin
        run: dotnet build src/ZhaDai.Runtime -c Release

      - uses: microsoft/setup-msbuild@v2

      - name: Build patcher
        run: msbuild src/ZhaDai.Patcher/ZhaDai.Patcher.csproj /p:Configuration=Release /verbosity:minimal

      - name: Zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version) { $version = "dev" }

          New-Item -ItemType Directory -Force staging/injected | Out-Null
          Copy-Item src/ZhaDai.Runtime/bin/Release/net48/ZhaDai.Runtime.dll staging/injected/
          Copy-Item src/ZhaDai.Runtime/bin/Release/net48/ZhaDai.Automation.dll staging/injected/
          Copy-Item src/ZhaDai.Patcher/bin/Release/net48/ZhaDai.Patcher.exe staging/injected/
          Copy-Item src/ZhaDai.Patcher/bin/Release/net48/Mono.Cecil*.dll staging/injected/

          Compress-Archive -Path staging/cli/*      -DestinationPath "artifacts/ZhaDai-cli-$version-win-x64.zip" -Force
          Compress-Archive -Path staging/ui/*       -DestinationPath "artifacts/ZhaDai-ui-$version-win-x64.zip" -Force
          Compress-Archive -Path staging/injected/* -DestinationPath "artifacts/ZhaDai-injected-$version.zip" -Force
          Get-ChildItem artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
