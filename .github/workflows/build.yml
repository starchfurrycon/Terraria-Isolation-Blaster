name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The planner, the automation state machine and the front end all build and test without the
      # game, which is deliberate: CI must not need a Terraria install.
      - name: Build
        run: |
          dotnet build src/ZhaDai.Core -c Release
          dotnet build src/ZhaDai.Automation -c Release
          dotnet build src/ZhaDai.Cli -c Release
          dotnet build src/ZhaDai.Manager -c Release

      - name: Test
        run: dotnet run --project tests/ZhaDai.Core.Tests -c Release

      - name: UI smoke render
        run: |
          dotnet run --project src/ZhaDai.Manager -c Release -- --ui-smoke=artifacts/ui-smoke

      - name: Collect artifacts
        run: |
          mkdir artifacts/cli
          copy src/ZhaDai.Cli/bin/Release/net8.0/zhaodai.dll artifacts/cli/
          copy src/ZhaDai.Cli/bin/Release/net8.0/zhaodai.exe artifacts/cli/

      - uses: actions/upload-artifact@v4
        with:
          name: zhadai-cli
          path: artifacts/cli

      - uses: actions/upload-artifact@v4
        with:
          name: zhadai-ui-smoke
          path: artifacts/ui-smoke
